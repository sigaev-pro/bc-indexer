name: Bootstrap checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: bootstrap/ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Check documents, code, and bootstrap evidence
        env:
          BOOTSTRAP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BOOTSTRAP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python .project/automation/ci.py
