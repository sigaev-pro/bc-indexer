# The public RPC endpoint of the verification run: the Polygon Amoy
# testnet WebSocket served by PublicNode. No local node is involved; the
# adapter derives the chain identity from the live endpoint and verifies
# the chain_id below against it.
#
# The official rpc-amoy.polygon.technology endpoint is documented as the
# Amoy RPC but stopped resolving entirely (the zone serves no address
# record as of 2026-11-24), so this config uses the public Amoy mirror
# of the same provider as the other two networks.
rpc_url: wss://polygon-amoy-bor-rpc.publicnode.com

# The demo NATS JetStream of the contour (localhost:4222); the normalized
# JSON events land here with a 5-minute retention.
nats_url: nats://localhost:4222

# The contour name and the stream identity of this network: the adapter
# publishes to extractor.poly-testnet.> inside EXTRACTOR_POLY_TESTNET.
network: poly-testnet

# The expected chain identity of the endpoint, checked against eth_chainId:
# whatever endpoint serves this config must prove it is Amoy.
chain_id: 80002

# The size of the verification window: the adapter captures this many
# blocks and exits, so a test run costs minutes, not the whole chain.
max_blocks: 20
