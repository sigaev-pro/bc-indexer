schema_version: 1
network:
  profile: ethereum-mainnet
native:
  kind: geth
destination:
  binding_file: /config/binding.json
delivery:
  gateway_endpoint: https://eth-gateway:50051
  tls:
    mode: mutual
    ca_file: /run/secrets/ca.pem
    cert_file: /run/secrets/adapter.crt
    key_file: /run/secrets/adapter.key
storage:
  live_dir: /data/wal
runtime:
  log_level: info
