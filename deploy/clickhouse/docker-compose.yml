# The ClickHouse analytics stack of the extractor: JetStream transport,
# universal event table, and the sink service that bridges them. Host
# ports are loopback-bound so the stack never collides with other local
# NATS/ClickHouse installations.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.11-alpine
    # The image restricts the passwordless `default` user to the
    # container loopback; a shared secret opens it to the compose
    # network (the sink must reach it as clickhouse:9000).
    environment:
      - CLICKHOUSE_PASSWORD=clickhouse
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"] # HTTP + native
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: 262144
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    # -sd points JetStream at the mounted volume: plain -js stores in
    # /tmp/nats/jetstream and a restart would drop streams, durables and
    # every queued event despite the volume mount.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222"]
    volumes:
      - nats-data:/data
    restart: unless-stopped

  sink:
    build: ../../cmd/clickhouse-sink
    depends_on: [clickhouse, nats]
    environment:
      - NATS_URL=nats://nats:4222
      - CLICKHOUSE_URL=clickhouse:9000
      - CLICKHOUSE_PASSWORD=clickhouse
    restart: unless-stopped

volumes:
  clickhouse-data:
  nats-data:
